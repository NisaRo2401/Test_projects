<VirtualHost *:80>
    ServerName projects.noxsolutions.de

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8080/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/projects-noxsolutions-error.log
    CustomLog ${APACHE_LOG_DIR}/projects-noxsolutions-access.log combined
</VirtualHost>
