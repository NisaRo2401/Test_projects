server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /assets/js/config.js {
    expires -1;
    try_files $uri =404;
  }

  location ~* \.html$ {
    expires -1;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|json|svg|png|jpe?g|gif|webp|wasm)$ {
    expires 1h;
    try_files $uri =404;
  }

  location ~ /\. {
    deny all;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
